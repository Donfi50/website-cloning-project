name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: videohub
          POSTGRES_PASSWORD: videohub
          POSTGRES_DB: videohub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U videohub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://videohub:videohub@localhost:5432/videohub
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      AUTH_TRUST_HOST: "true"
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate the Prisma client
        run: npx prisma generate
      - name: Create the tables in a real Postgres (checks the schema works)
        run: npx prisma db push --skip-generate
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npx next build
